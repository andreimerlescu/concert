  <text x="526" y="310" text-anchor="middle" class="sans" font-size="10.5" fill="#747c90">fcgi+unix:// · try_files · upload guards</text>

  <rect x="654" y="270" width="228" height="56" rx="9" fill="#1a8cd8" fill-opacity="0.10" stroke="#1a8cd8" stroke-width="1.4"/>
  <text x="768" y="292" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#1a8cd8">Anonymous GET Micro-Cache</text>
  <text x="768" y="310" text-anchor="middle" class="sans" font-size="10.5" fill="#747c90">Singleflight collapse · cart/login bypass</text>

  <rect x="896" y="270" width="230" height="56" rx="9" fill="#1a8cd8" fill-opacity="0.10" stroke="#1a8cd8" stroke-width="1.4"/>
  <text x="1011" y="292" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#1a8cd8">WordPress CLI &amp; Presets</text>
  <text x="1011" y="310" text-anchor="middle" class="sans" font-size="10.5" fill="#747c90">preset wordpress · doctor · init</text>

  <!-- Inner Core Onion Layer: concert -->
  <rect x="420" y="346" width="698" height="218" rx="14" fill="#8b5cf6" fill-opacity="0.09" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="440" y="362" width="122" height="26" rx="13" fill="#7c3aed"/>
  <text x="501" y="379" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#ffffff">1 · concert</text>
  <rect x="572" y="363" width="144" height="24" rx="12" fill="#252136"/>
  <text x="644" y="379" text-anchor="middle" class="mono" font-size="10.8" font-weight="600" fill="#ddd6fe">default build tags</text>
  <rect x="926" y="363" width="172" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.14" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="1012" y="379" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#8b5cf6">23 SBOM components</text>

  <!-- Core 2x3 feature grid -->
  <rect x="442" y="404" width="208" height="62" rx="9" fill="#8b5cf6" fill-opacity="0.11" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="546" y="428" text-anchor="middle" class="sans" font-size="11.8" font-weight="700" fill="#8b5cf6">FIFO Waiting Room</text>
  <text x="546" y="448" text-anchor="middle" class="sans" font-size="10.5" fill="#747c90">Priority lane · Ed25519 passes</text>

  <rect x="664" y="404" width="208" height="62" rx="9" fill="#8b5cf6" fill-opacity="0.11" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="768" y="428" text-anchor="middle" class="sans" font-size="11.8" font-weight="700" fill="#8b5cf6">TLS · HTTP/2 · HTTP/3</text>
  <text x="768" y="448" text-anchor="middle" class="sans" font-size="10.5" fill="#747c90">ACME :80→:443 · opt-in QUIC</text>

  <rect x="886" y="404" width="212" height="62" rx="9" fill="#8b5cf6" fill-opacity="0.11" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="992" y="428" text-anchor="middle" class="sans" font-size="11.8" font-weight="700" fill="#8b5cf6">os.Root Static Offload</text>
  <text x="992" y="448" text-anchor="middle" class="sans" font-size="10.5" fill="#747c90">.br/.gz · ETag · Range · jail</text>

  <rect x="442" y="480" width="208" height="62" rx="9" fill="#0d9488" fill-opacity="0.10" stroke="#0d9488" stroke-width="1.4"/>
  <text x="546" y="504" text-anchor="middle" class="sans" font-size="11.8" font-weight="700" fill="#0d9488">Concertfile Multi-Vhost</text>
  <text x="546" y="524" text-anchor="middle" class="sans" font-size="10.5" fill="#747c90">SNI dispatch · SIGHUP reload</text>

  <rect x="664" y="480" width="208" height="62" rx="9" fill="#0d9488" fill-opacity="0.10" stroke="#0d9488" stroke-width="1.4"/>
  <text x="768" y="504" text-anchor="middle" class="sans" font-size="11.8" font-weight="700" fill="#0d9488">Abuse &amp; Slowloris Defense</text>
  <text x="768" y="524" text-anchor="middle" class="sans" font-size="10.5" fill="#747c90">Strikes · bans · upload timeouts</text>

  <rect x="886" y="480" width="212" height="62" rx="9" fill="#0d9488" fill-opacity="0.10" stroke="#0d9488" stroke-width="1.4"/>
  <text x="992" y="504" text-anchor="middle" class="sans" font-size="11.8" font-weight="700" fill="#0d9488">Portal &amp; Observability</text>
  <text x="992" y="524" text-anchor="middle" class="sans" font-size="10.5" fill="#747c90">Site switcher · /_room/metrics</text>
</svg>
