  <rect x="382" y="138" width="182" height="56" rx="9" fill="#d9468f" fill-opacity="0.10" stroke="#d9468f" stroke-width="1.4"/>
  <text x="473" y="160" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#d9468f">Edge / Leaf Mesh</text>
  <text x="473" y="178" text-anchor="middle" class="sans" font-size="10.5" fill="#747c90">mTLS · weighted shares</text>

  <rect x="576" y="138" width="184" height="56" rx="9" fill="#d9468f" fill-opacity="0.10" stroke="#d9468f" stroke-width="1.4"/>
  <text x="668" y="160" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#d9468f">RBAC · MFA · SSO</text>
  <text x="668" y="178" text-anchor="middle" class="sans" font-size="10.5" fill="#747c90">Argon2id · TOTP · audit log</text>

  <rect x="772" y="138" width="184" height="56" rx="9" fill="#d9468f" fill-opacity="0.10" stroke="#d9468f" stroke-width="1.4"/>
  <text x="864" y="160" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#d9468f">Redis HA &amp; Mailer</text>
  <text x="864" y="178" text-anchor="middle" class="sans" font-size="10.5" fill="#747c90">Ban sync · alert dedupe</text>

  <rect x="968" y="138" width="184" height="56" rx="9" fill="#d9468f" fill-opacity="0.10" stroke="#d9468f" stroke-width="1.4"/>
  <text x="1060" y="160" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#d9468f">x402 Fast-Lane</text>
  <text x="1060" y="178" text-anchor="middle" class="sans" font-size="10.5" fill="#747c90">Online reconcile · archive</text>

  <!-- Middle Onion Layer: wpconcert -->
  <rect x="390" y="214" width="756" height="374" rx="15" fill="#1a8cd8" fill-opacity="0.07" stroke="#1a8cd8" stroke-width="2"/>
  <rect x="410" y="230" width="136" height="26" rx="13" fill="#0369a1"/>
  <text x="478" y="247" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#ffffff">2 · wpconcert</text>
  <rect x="556" y="231" width="144" height="24" rx="12" fill="#252136"/>
  <text x="628" y="247" text-anchor="middle" class="mono" font-size="10.8" font-weight="600" fill="#7dd3fc">-tags wordpress</text>
  <rect x="954" y="231" width="172" height="24" rx="12" fill="#1a8cd8" fill-opacity="0.14" stroke="#1a8cd8" stroke-width="1.2"/>
  <text x="1040" y="247" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#1a8cd8">23 SBOM components</text>

