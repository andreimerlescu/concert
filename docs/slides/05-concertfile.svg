<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#1a8cd8"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#d9468f"/>
    </marker>
  </defs>

  <!-- Header -->
  <rect x="28" y="18" width="194" height="28" rx="14" fill="#0369a1"/>
  <text x="125" y="36" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" letter-spacing="1.0" fill="#ffffff">05 · THE CONCERTFILE</text>
  <text x="236" y="37" class="sans" font-size="14" font-weight="600" fill="#747c90">One declarative config powering isolated multi-vhost rooms with zero-downtime reloads</text>
  <rect x="1044" y="18" width="128" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1108" y="36" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#8b5cf6">concert v0.3.0</text>
  <line x1="28" y1="60" x2="1172" y2="60" stroke="#747c90" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Left Column: Concertfile Source -->
  <rect x="28" y="76" width="322" height="426" rx="14" fill="#1a8cd8" fill-opacity="0.06" stroke="#1a8cd8" stroke-width="2"/>
  <rect x="44" y="92" width="188" height="24" rx="12" fill="#0369a1"/>
  <text x="138" y="108" text-anchor="middle" class="sans" font-size="10.2" font-weight="700" letter-spacing="0.8" fill="#ffffff">SINGLE SOURCE OF TRUTH</text>
  <rect x="238" y="93" width="98" height="22" rx="11" fill="#252136"/>
  <text x="287" y="108" text-anchor="middle" class="mono" font-size="9.8" font-weight="600" fill="#7dd3fc">-config | .json</text>

  <!-- Global Block -->
  <rect x="46" y="130" width="286" height="148" rx="10" fill="#8b5cf6" fill-opacity="0.10" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="58" y="141" width="126" height="20" rx="10" fill="#7c3aed"/>
  <text x="121" y="155" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#ffffff">Global { ... }</text>
  <text x="60" y="181" class="mono" font-size="11" fill="#747c90">listen :443  ·  http_listen :80</text>
  <text x="60" y="200" class="mono" font-size="11" fill="#747c90">tls_email · ACME · http3 on</text>
  <text x="60" y="219" class="mono" font-size="11" fill="#747c90">portal_listen 127.0.0.1:8081</text>
  <text x="60" y="238" class="mono" font-size="11" fill="#747c90">body_read_idle_timeout 30s</text>
  <text x="60" y="257" class="mono" font-size="11" fill="#747c90">max_upload_time 10m</text>

  <!-- Site Blocks -->
  <rect x="46" y="292" width="286" height="92" rx="10" fill="#0d9488" fill-opacity="0.10" stroke="#0d9488" stroke-width="1.5"/>
  <rect x="58" y="303" width="194" height="20" rx="10" fill="#0f766e"/>
  <text x="155" y="317" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#ffffff">shop.example.com { ... }</text>
  <text x="60" y="342" class="mono" font-size="10.8" fill="#747c90">preset wordpress · cap 12 · prio 4</text>
  <text x="60" y="360" class="mono" font-size="10.8" fill="#747c90">micro_cache 15s · root /var/www/shop</text>
  <text x="60" y="376" class="mono" font-size="10.8" fill="#0d9488">upstream fcgi+unix://php8.3-fpm.sock</text>

  <rect x="46" y="396" width="286" height="90" rx="10" fill="#d97706" fill-opacity="0.10" stroke="#d97706" stroke-width="1.5"/>
  <rect x="58" y="407" width="174" height="20" rx="10" fill="#b45309"/>
  <text x="145" y="421" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#ffffff">api.example.com { ... }</text>
  <text x="60" y="446" class="mono" font-size="10.8" fill="#747c90">cap 40 · priority_cap 10 · max_queue 1000</text>
  <text x="60" y="464" class="mono" font-size="10.8" fill="#747c90">assets /static/* · bypass /healthz</text>
  <text x="60" y="479" class="mono" font-size="10.8" fill="#d97706">upstream :3000, :3001</text>

  <!-- Arrow: Concertfile -> Shared Listener -->
  <line x1="350" y1="286" x2="398" y2="286" stroke="#1a8cd8" stroke-width="2.4" marker-end="url(#arr-blue)"/>
  <rect x="351" y="254" width="46" height="20" rx="10" fill="#252136"/>
  <text x="374" y="268" text-anchor="middle" class="mono" font-size="9.5" font-weight="600" fill="#7dd3fc">loads</text>

  <!-- Center Column: Shared Front Listener -->
  <rect x="402" y="76" width="256" height="426" rx="14" fill="#8b5cf6" fill-opacity="0.06" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="420" y="92" width="198" height="24" rx="12" fill="#7c3aed"/>
  <text x="519" y="108" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#ffffff">SHARED FRONT LISTENER</text>

  <rect x="420" y="130" width="220" height="68" rx="10" fill="#1a8cd8" fill-opacity="0.10" stroke="#1a8cd8" stroke-width="1.5"/>
  <text x="530" y="155" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#1a8cd8">HTTP :80</text>
  <text x="530" y="174" text-anchor="middle" class="sans" font-size="11" fill="#747c90">ACME HTTP-01 challenges</text>
  <text x="530" y="190" text-anchor="middle" class="sans" font-size="11" fill="#747c90">Strict-Host 301/308 → HTTPS</text>

  <rect x="420" y="212" width="220" height="114" rx="10" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="1.75"/>
  <text x="530" y="238" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#8b5cf6">HTTPS :443 + HTTP/3</text>
  <text x="530" y="260" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#747c90">Dynamic SNI TLS Router</text>
  <text x="530" y="279" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#747c90">&amp; Host Header Dispatch</text>
  <rect x="448" y="292" width="164" height="22" rx="11" fill="#252136"/>
  <text x="530" y="307" text-anchor="middle" class="mono" font-size="10" fill="#ddd6fe">TCP + UDP QUIC (:443)</text>

  <rect x="420" y="340" width="220" height="62" rx="10" fill="#d9468f" fill-opacity="0.10" stroke="#d9468f" stroke-width="1.5"/>
  <text x="530" y="365" text-anchor="middle" class="sans" font-size="11.8" font-weight="700" fill="#d9468f">Unknown Host Rejected</text>
  <text x="530" y="385" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#747c90">421 Misdirected Request</text>

  <rect x="420" y="416" width="220" height="70" rx="10" fill="#0d9488" fill-opacity="0.10" stroke="#0d9488" stroke-width="1.5"/>
  <text x="530" y="441" text-anchor="middle" class="sans" font-size="11.8" font-weight="700" fill="#0d9488">Admin Portal (:8081)</text>
  <text x="530" y="460" text-anchor="middle" class="sans" font-size="10.8" fill="#747c90">Site switcher (?site=) · Bans</text>
  <text x="530" y="476" text-anchor="middle" class="sans" font-size="10.8" fill="#747c90">Emergency live cap override</text>

  <!-- Routing arrows from SNI Router to Site 1 & Site 2 -->
  <path d="M 658 242 C 686 242, 684 176, 712 176" fill="none" stroke="#0d9488" stroke-width="2.4" marker-end="url(#arr-teal)"/>
  <path d="M 658 296 C 686 296, 684 396, 712 396" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arr-amber)"/>

  <!-- Right Column Site 1: shop.example.com -->
  <rect x="716" y="76" width="456" height="202" rx="14" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488" stroke-width="2"/>
  <rect x="734" y="92" width="160" height="24" rx="12" fill="#0f766e"/>
  <text x="814" y="108" text-anchor="middle" class="mono" font-size="10.8" font-weight="700" fill="#ffffff">shop.example.com</text>
  <rect x="904" y="93" width="122" height="22" rx="11" fill="#252136"/>
  <text x="965" y="108" text-anchor="middle" class="mono" font-size="10" fill="#99f6e4">preset wordpress</text>
  <text x="1038" y="108" class="mono" font-size="10.5" font-weight="700" fill="#0d9488">cap 12 + 4 prio</text>

  <rect x="734" y="132" width="126" height="84" rx="9" fill="#0d9488" fill-opacity="0.11" stroke="#0d9488" stroke-width="1.4"/>
  <text x="797" y="156" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#0d9488">Static &amp; Bans</text>
  <text x="797" y="175" text-anchor="middle" class="mono" font-size="10" fill="#747c90">/var/www/shop</text>
  <text x="797" y="193" text-anchor="middle" class="sans" font-size="10.2" fill="#747c90">os.Root jail</text>
  <text x="797" y="208" text-anchor="middle" class="sans" font-size="10.2" fill="#747c90">xmlrpc / .env ban</text>

  <line x1="860" y1="174" x2="880" y2="174" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arr-teal)"/>

  <rect x="884" y="132" width="136" height="84" rx="9" fill="#8b5cf6" fill-opacity="0.11" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="952" y="156" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#8b5cf6">Room + Cache</text>
  <text x="952" y="175" text-anchor="middle" class="mono" font-size="10" fill="#747c90">micro_cache 15s</text>
  <text x="952" y="193" text-anchor="middle" class="sans" font-size="10.2" fill="#747c90">Isolated waiting</text>
  <text x="952" y="208" text-anchor="middle" class="sans" font-size="10.2" fill="#747c90">room &amp; cookies</text>

  <line x1="1020" y1="174" x2="1040" y2="174" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arr-teal)"/>

  <rect x="1044" y="132" width="110" height="84" rx="9" fill="#1a8cd8" fill-opacity="0.11" stroke="#1a8cd8" stroke-width="1.4"/>
  <text x="1099" y="156" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#1a8cd8">PHP-FPM</text>
  <text x="1099" y="175" text-anchor="middle" class="mono" font-size="9.6" fill="#747c90">fcgi+unix://</text>
  <text x="1099" y="193" text-anchor="middle" class="mono" font-size="9.6" fill="#747c90">php8.3-fpm</text>
  <text x="1099" y="208" text-anchor="middle" class="mono" font-size="9.6" fill="#747c90">.sock</text>

  <rect x="734" y="228" width="420" height="32" rx="8" fill="#252136"/>
  <text x="944" y="248" text-anchor="middle" class="mono" font-size="9.8" fill="#99f6e4">Isolated room · os.Root jail · room_scope="shop.example.com"</text>

  <!-- Right Column Site 2: api.example.com -->
  <rect x="716" y="298" width="456" height="204" rx="14" fill="#d97706" fill-opacity="0.06" stroke="#d97706" stroke-width="2"/>
  <rect x="734" y="314" width="146" height="24" rx="12" fill="#b45309"/>
  <text x="807" y="330" text-anchor="middle" class="mono" font-size="10.8" font-weight="700" fill="#ffffff">api.example.com</text>
  <rect x="890" y="315" width="118" height="22" rx="11" fill="#252136"/>
  <text x="949" y="330" text-anchor="middle" class="mono" font-size="10" fill="#fde68a">max_queue 1000</text>
  <text x="1020" y="330" class="mono" font-size="10.5" font-weight="700" fill="#d97706">cap 40 + 10 prio</text>

  <rect x="734" y="354" width="126" height="84" rx="9" fill="#d97706" fill-opacity="0.11" stroke="#d97706" stroke-width="1.4"/>
  <text x="797" y="378" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#d97706">Static &amp; Bypass</text>
  <text x="797" y="397" text-anchor="middle" class="mono" font-size="10" fill="#747c90">/static/*</text>
  <text x="797" y="415" text-anchor="middle" class="mono" font-size="10" fill="#747c90">/healthz</text>
  <text x="797" y="430" text-anchor="middle" class="sans" font-size="10.2" fill="#747c90">bypassed</text>

  <line x1="860" y1="396" x2="880" y2="396" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>

  <rect x="884" y="354" width="136" height="84" rx="9" fill="#8b5cf6" fill-opacity="0.11" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="952" y="378" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#8b5cf6">Isolated Room</text>
  <text x="952" y="397" text-anchor="middle" class="sans" font-size="10.2" fill="#747c90">Independent FIFO</text>
  <text x="952" y="415" text-anchor="middle" class="sans" font-size="10.2" fill="#747c90">queue &amp; 429 API</text>
  <text x="952" y="430" text-anchor="middle" class="sans" font-size="10.2" fill="#747c90">JSON responses</text>

  <line x1="1020" y1="396" x2="1040" y2="396" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>

  <rect x="1044" y="354" width="110" height="84" rx="9" fill="#1a8cd8" fill-opacity="0.11" stroke="#1a8cd8" stroke-width="1.4"/>
  <text x="1099" y="378" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#1a8cd8">HTTP Pool</text>
  <text x="1099" y="397" text-anchor="middle" class="mono" font-size="10" fill="#747c90">:3000</text>
  <text x="1099" y="415" text-anchor="middle" class="mono" font-size="10" fill="#747c90">:3001</text>
  <text x="1099" y="430" text-anchor="middle" class="sans" font-size="10" fill="#747c90">health-checked</text>

  <rect x="734" y="450" width="420" height="32" rx="8" fill="#252136"/>
  <text x="944" y="470" text-anchor="middle" class="mono" font-size="9.8" fill="#fde68a">Isolated room · Isolated bans · room_scope="api.example.com"</text>

  <!-- Bottom Control Loop: Zero-Downtime Hot Reload -->
  <rect x="28" y="520" width="1144" height="94" rx="14" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488" stroke-width="1.75"/>
  <rect x="46" y="555" width="194" height="24" rx="12" fill="#0f766e"/>
  <text x="143" y="571" text-anchor="middle" class="sans" font-size="10.3" font-weight="700" letter-spacing="0.8" fill="#ffffff">ZERO-DOWNTIME RELOAD</text>

  <rect x="256" y="541" width="214" height="52" rx="10" fill="#252136"/>
  <text x="363" y="563" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#7dd3fc">kill -HUP  /  Portal Reload</text>
  <text x="363" y="581" text-anchor="middle" class="sans" font-size="10.5" fill="#cbd5e1">No dropped connections or restarts</text>

  <line x1="470" y1="567" x2="498" y2="567" stroke="#0d9488" stroke-width="2" marker-end="url(#arr-teal)"/>

  <rect x="502" y="541" width="196" height="52" rx="10" fill="#8b5cf6" fill-opacity="0.11" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="600" y="563" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#8b5cf6">Parse &amp; Validate</text>
  <text x="600" y="581" text-anchor="middle" class="sans" font-size="10.5" fill="#747c90">Syntax, roots, pools &amp; keys</text>

  <!-- Clean Y-fork: Valid (top) vs Invalid (bottom) -->
  <path d="M 698 556 L 722 556 L 722 547 L 748 547" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arr-teal)"/>
  <path d="M 698 578 L 722 578 L 722 587 L 748 587" fill="none" stroke="#d9468f" stroke-width="2" marker-end="url(#arr-rose)"/>

  <rect x="752" y="531" width="402" height="32" rx="9" fill="#0d9488" fill-opacity="0.12" stroke="#0d9488" stroke-width="1.5"/>
  <text x="768" y="551" class="sans" font-size="11.5" font-weight="700" fill="#0d9488">Valid → Atomic Generation Swap</text>
  <text x="974" y="551" class="sans" font-size="10.8" fill="#747c90">Live vhosts &amp; caps updated</text>

  <rect x="752" y="571" width="402" height="32" rx="9" fill="#d9468f" fill-opacity="0.11" stroke="#d9468f" stroke-width="1.5"/>
  <text x="768" y="591" class="sans" font-size="11.5" font-weight="700" fill="#d9468f">Invalid → Automatic Rollback</text>
  <text x="960" y="591" class="sans" font-size="10.8" fill="#747c90">Active config stays online</text>
</svg>
