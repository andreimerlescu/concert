<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 836" width="720" height="836">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- TOP PANEL: sema v1.3.0 -->
  <rect x="16" y="16" width="688" height="314" rx="16" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.2"/>
  <rect x="34" y="32" width="122" height="30" rx="15" fill="#0f766e"/>
  <text x="95" y="52" text-anchor="middle" class="mono" font-size="13.5" font-weight="700" fill="#ffffff">sema v1.3.0</text>
  <text x="170" y="53" class="sans" font-size="17.5" font-weight="700" fill="#0f172a">PrioritySemaphore &amp; Safe Shrink</text>

  <!-- 4 Priority Tiers -->
  <rect x="34" y="76" width="332" height="36" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="1.8"/>
  <rect x="42" y="82" width="144" height="24" rx="12" fill="#be185d"/>
  <text x="114" y="98.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#ffffff">PriorityCritical</text>
  <text x="198" y="99" class="sans" font-size="13.5" font-weight="600" fill="#0f172a">Checkout &amp; staff</text>

  <rect x="34" y="118" width="332" height="36" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <rect x="42" y="124" width="144" height="24" rx="12" fill="#b45309"/>
  <text x="114" y="140.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#ffffff">PriorityHigh</text>
  <text x="198" y="141" class="sans" font-size="13.5" font-weight="600" fill="#0f172a">Lane-ranked &amp; paid</text>

  <rect x="34" y="160" width="332" height="36" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
  <rect x="42" y="166" width="144" height="24" rx="12" fill="#0284c7"/>
  <text x="114" y="182.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#ffffff">PriorityNormal</text>
  <text x="198" y="183" class="sans" font-size="13.5" font-weight="600" fill="#0f172a">Admitted visitors</text>

  <rect x="34" y="202" width="332" height="36" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/>
  <rect x="42" y="208" width="144" height="24" rx="12" fill="#475569"/>
  <text x="114" y="224.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#ffffff">PriorityLow</text>
  <text x="198" y="225" class="sans" font-size="13.5" font-weight="600" fill="#0f172a">Public assets</text>

  <!-- Arrows into O(1) Bitmask Box -->
  <line x1="366" y1="94" x2="408" y2="128" stroke="#0d9488" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="366" y1="136" x2="408" y2="148" stroke="#0d9488" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="366" y1="178" x2="408" y2="168" stroke="#0d9488" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="366" y1="220" x2="408" y2="188" stroke="#0d9488" stroke-width="2" marker-end="url(#arr-teal)"/>

  <!-- O(1) Bitmask Dispatcher -->
  <rect x="412" y="80" width="274" height="154" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <g transform="translate(430, 96)" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12,2 4,13 11,13 10,21 18,10 11,10"/>
  </g>
  <text x="460" y="113" class="sans" font-size="16" font-weight="700" fill="#0f172a">O(1) Bitmask Dispatch</text>
  <text x="430" y="144" class="sans" font-size="14" font-weight="500" fill="#334155">• Strict FIFO inside each tier</text>
  <text x="430" y="170" class="sans" font-size="14" font-weight="500" fill="#334155">• Zero-alloc uncontended path</text>
  <rect x="430" y="190" width="238" height="28" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="549" y="208.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#6d28d9">100% Semaphore Compatible</text>

  <!-- Bottom 2 chips inside sema panel -->
  <rect x="34" y="252" width="318" height="60" rx="11" fill="#ffffff" stroke="#0d9488" stroke-width="1.75"/>
  <text x="50" y="277" class="mono" font-size="14" font-weight="700" fill="#0f766e">Non-Draining SetCap</text>
  <text x="50" y="299" class="sans" font-size="13.5" font-weight="500" fill="#334155">Shrink keeps in-flight slots intact</text>

  <rect x="368" y="252" width="318" height="60" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="1.75"/>
  <text x="384" y="277" class="mono" font-size="14" font-weight="700" fill="#0369a1">HighestWaitingPriority()</text>
  <text x="384" y="299" class="sans" font-size="13.5" font-weight="500" fill="#334155">Lock-free atomic contention signal</text>

  <!-- Bridge Connector -->
  <line x1="360" y1="330" x2="360" y2="378" stroke="#7c3aed" stroke-width="2.8" marker-end="url(#arr-purple)"/>
  <rect x="304" y="340" width="112" height="26" rx="13" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="360" y="357.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#ddd6fe">powers</text>

  <!-- MIDDLE PANEL: room v1.8.0 -->
  <rect x="16" y="382" width="688" height="334" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2"/>
  <rect x="34" y="398" width="122" height="30" rx="15" fill="#7c3aed"/>
  <text x="95" y="418" text-anchor="middle" class="mono" font-size="13.5" font-weight="700" fill="#ffffff">room v1.8.0</text>
  <text x="170" y="419" class="sans" font-size="17.5" font-weight="700" fill="#0f172a">Treap Queue, Parallel Polls &amp; Ed25519</text>

  <!-- 2x2 Room Engine Grid -->
  <rect x="34" y="444" width="318" height="120" rx="13" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
  <rect x="50" y="458" width="190" height="26" rx="13" fill="#0284c7"/>
  <text x="145" y="475.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#ffffff">O(log N) Treap Store</text>
  <text x="50" y="509" class="sans" font-size="14" font-weight="600" fill="#0f172a">Replaces O(N) queue scans</text>
  <text x="50" y="534" class="sans" font-size="13.5" font-weight="500" fill="#334155">Fast Enter, Position &amp; Rank lookup</text>

  <rect x="368" y="444" width="318" height="120" rx="13" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/>
  <rect x="384" y="458" width="194" height="26" rx="13" fill="#0f766e"/>
  <text x="481" y="475.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#ffffff">Parallel RLock Polls</text>
  <text x="384" y="509" class="sans" font-size="14" font-weight="600" fill="#0f172a">Concurrent /queue/status</text>
  <text x="384" y="534" class="sans" font-size="13.5" font-weight="500" fill="#334155">Reads never serialize on write locks</text>

  <rect x="34" y="578" width="318" height="120" rx="13" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <rect x="50" y="592" width="214" height="26" rx="13" fill="#b45309"/>
  <text x="157" y="609.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#ffffff">Lazy-Heap &amp; Compaction</text>
  <text x="50" y="643" class="sans" font-size="14" font-weight="600" fill="#0f172a">Self-shrinking after bursts</text>
  <text x="50" y="668" class="sans" font-size="13.5" font-weight="500" fill="#334155">Instant TTL updates + heap shrink</text>

  <rect x="368" y="578" width="318" height="120" rx="13" fill="#ffffff" stroke="#db2777" stroke-width="1.8"/>
  <!-- Lock icon -->
  <g transform="translate(384, 592)" fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="10" width="14" height="10" rx="2"/>
    <path d="M6 10 V7 A4 4 0 0 1 14 7 V10"/>
  </g>
  <rect x="410" y="592" width="222" height="26" rx="13" fill="#be185d"/>
  <text x="521" y="609.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#ffffff">Stateless Ed25519 rm1</text>
  <text x="384" y="643" class="sans" font-size="14" font-weight="600" fill="#0f172a">Verify-only split (zero Redis)</text>
  <text x="384" y="668" class="sans" font-size="13.5" font-weight="500" fill="#334155">Validate() &amp; tamper strike hooks</text>

  <!-- BOTTOM OUTCOME BAR -->
  <rect x="16" y="734" width="688" height="86" rx="16" fill="#0f172a" stroke="#475569" stroke-width="1.8"/>
  <text x="360" y="766" text-anchor="middle" class="sans" font-size="16.5" font-weight="700" fill="#ffffff">Result: Flat Queue Latency Under Massive Traffic Spikes</text>
  <rect x="44" y="780" width="196" height="28" rx="14" fill="#1e293b"/>
  <text x="142" y="798.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#5eead4">O(N) → O(log N)</text>
  <rect x="262" y="780" width="196" height="28" rx="14" fill="#1e293b"/>
  <text x="360" y="798.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#7dd3fc">Parallel RLock</text>
  <rect x="480" y="780" width="196" height="28" rx="14" fill="#1e293b"/>
  <text x="578" y="798.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#f9a8d4">Local Ed25519</text>
</svg>
