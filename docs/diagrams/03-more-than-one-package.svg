<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 704" width="720" height="704">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- LAYER 3 (Top): concert application suite -->
  <rect x="16" y="16" width="688" height="190" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2"/>
  <!-- Queue bars icon -->
  <g transform="translate(36, 36)" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round">
    <line x1="2" y1="16" x2="2" y2="7"/>
    <line x1="8" y1="16" x2="8" y2="2"/>
    <line x1="14" y1="16" x2="14" y2="5"/>
    <line x1="20" y1="16" x2="20" y2="10"/>
  </g>
  <text x="68" y="53" class="mono" font-size="20" font-weight="700" fill="#0f172a">concert</text>
  <rect x="170" y="32" width="302" height="28" rx="14" fill="#0f172a"/>
  <text x="321" y="50.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#ddd6fe">github.com/andreimerlescu/concert</text>
  <rect x="546" y="32" width="140" height="28" rx="14" fill="#7c3aed"/>
  <text x="616" y="50.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">FRONT DOOR</text>

  <text x="36" y="86" class="sans" font-size="14.5" font-weight="500" fill="#334155">HTTP/3 proxy, static &amp; FastCGI routing, abuse control, mesh &amp; Portal</text>

  <!-- 4 binary chips -->
  <rect x="34" y="106" width="152" height="80" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.75"/>
  <text x="110" y="138" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#0f172a">concert</text>
  <text x="110" y="164" text-anchor="middle" class="sans" font-size="13" font-weight="500" fill="#334155">Core proxy</text>

  <rect x="200" y="106" width="152" height="80" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="1.75"/>
  <text x="276" y="138" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#0f172a">wpconcert</text>
  <text x="276" y="164" text-anchor="middle" class="sans" font-size="13" font-weight="500" fill="#334155">WordPress</text>

  <rect x="366" y="106" width="152" height="80" rx="12" fill="#ffffff" stroke="#db2777" stroke-width="1.75"/>
  <text x="442" y="138" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#0f172a">econcert</text>
  <text x="442" y="164" text-anchor="middle" class="sans" font-size="13" font-weight="500" fill="#334155">Enterprise</text>

  <rect x="532" y="106" width="154" height="80" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.75"/>
  <text x="609" y="138" text-anchor="middle" class="mono" font-size="14.5" font-weight="700" fill="#0f172a">concert-bench</text>
  <text x="609" y="164" text-anchor="middle" class="sans" font-size="13" font-weight="500" fill="#334155">Benchmark</text>

  <!-- Dependency Connector 3 -> 2 -->
  <line x1="360" y1="206" x2="360" y2="262" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arr-purple)"/>
  <rect x="148" y="218" width="424" height="28" rx="14" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="360" y="236.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#e2e8f0">depends on room  (+ direct sema for assets/streams)</text>

  <!-- LAYER 2 (Middle): room -->
  <rect x="16" y="266" width="688" height="184" rx="16" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.2"/>
  <!-- Layers icon -->
  <g transform="translate(36, 285)" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="11,2 21,7 11,12 1,7"/>
    <polyline points="1,12 11,17 21,12"/>
    <polyline points="1,17 11,22 21,17"/>
  </g>
  <text x="68" y="303" class="mono" font-size="20" font-weight="700" fill="#0f172a">room</text>
  <rect x="138" y="282" width="336" height="28" rx="14" fill="#0f172a"/>
  <text x="306" y="300.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#7dd3fc">github.com/andreimerlescu/room@v1.8.0</text>
  <rect x="526" y="282" width="160" height="28" rx="14" fill="#0284c7"/>
  <text x="606" y="300.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">QUEUE ENGINE</text>

  <text x="36" y="336" class="sans" font-size="14.5" font-weight="500" fill="#334155">Standalone Go waiting room package — reusable in any web app</text>

  <rect x="34" y="354" width="208" height="78" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="1.75"/>
  <text x="138" y="385" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#0f172a">Treap Queue</text>
  <text x="138" y="411" text-anchor="middle" class="sans" font-size="13.5" font-weight="500" fill="#334155">O(log N) order &amp; ranks</text>

  <rect x="256" y="354" width="208" height="78" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="1.75"/>
  <text x="360" y="385" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#0f172a">Parallel Polls</text>
  <text x="360" y="411" text-anchor="middle" class="sans" font-size="13.5" font-weight="500" fill="#334155">RLock /queue/status</text>

  <rect x="478" y="354" width="208" height="78" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="1.75"/>
  <text x="582" y="385" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#0f172a">Ed25519 Passes</text>
  <text x="582" y="411" text-anchor="middle" class="sans" font-size="13.5" font-weight="500" fill="#334155">Stateless rm1 tokens</text>

  <!-- Dependency Connector 2 -> 1 -->
  <line x1="360" y1="450" x2="360" y2="504" stroke="#0284c7" stroke-width="2.6" marker-end="url(#arr-blue)"/>
  <rect x="214" y="462" width="292" height="28" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="360" y="480.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#5eead4">depends on sema (concurrency slots)</text>

  <!-- LAYER 1 (Bottom): sema -->
  <rect x="16" y="508" width="688" height="180" rx="16" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.2"/>
  <!-- Bolt/Primitive icon -->
  <g transform="translate(36, 526)" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12,2 4,13 11,13 10,21 18,10 11,10"/>
  </g>
  <text x="68" y="545" class="mono" font-size="20" font-weight="700" fill="#0f172a">sema</text>
  <rect x="138" y="524" width="336" height="28" rx="14" fill="#0f172a"/>
  <text x="306" y="542.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#5eead4">github.com/andreimerlescu/sema@v1.3.0</text>
  <rect x="526" y="524" width="160" height="28" rx="14" fill="#0f766e"/>
  <text x="606" y="542.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">CONCURRENCY</text>

  <text x="36" y="578" class="sans" font-size="14.5" font-weight="500" fill="#334155">Zero-alloc stdlib semaphore — dynamic resizing &amp; priority tiers</text>

  <rect x="34" y="596" width="208" height="74" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.75"/>
  <text x="138" y="625" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#0f172a">PrioritySemaphore</text>
  <text x="138" y="650" text-anchor="middle" class="sans" font-size="13.5" font-weight="500" fill="#334155">4 O(1) FIFO tiers</text>

  <rect x="256" y="596" width="208" height="74" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.75"/>
  <text x="360" y="625" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#0f172a">Safe SetCap</text>
  <text x="360" y="650" text-anchor="middle" class="sans" font-size="13.5" font-weight="500" fill="#334155">Non-draining shrink</text>

  <rect x="478" y="596" width="208" height="74" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.75"/>
  <text x="582" y="625" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#0f172a">Telemetry Hooks</text>
  <text x="582" y="650" text-anchor="middle" class="sans" font-size="13.5" font-weight="500" fill="#334155">EWMA &amp; lock-free wait</text>
</svg>
