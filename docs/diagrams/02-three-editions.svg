<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 756" width="720" height="756">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Top Box: Single Go Repository -->
  <rect x="16" y="16" width="688" height="84" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <!-- Repo icon -->
  <g transform="translate(36, 36)" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6 C3 4.5 4.2 3.5 5.5 3.5 H10 L12 6 H18.5 C19.8 6 21 7 21 8.5 V17.5 C21 18.8 19.8 20 18.5 20 H5.5 C4.2 20 3 18.8 3 17.5 Z"/>
  </g>
  <text x="68" y="53" class="sans" font-size="18.5" font-weight="700" fill="#0f172a">Single Go Code Base</text>
  <rect x="276" y="32" width="166" height="28" rx="14" fill="#0f172a"/>
  <text x="359" y="50.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#e2e8f0">cmd/ + internal/</text>
  <rect x="454" y="32" width="232" height="28" rx="14" fill="#e2e8f0"/>
  <text x="570" y="50.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#334155">Zero Duplicated Core Code</text>
  <text x="68" y="81" class="sans" font-size="14" font-weight="500" fill="#334155">Go build tags compile each edition with only the packages it needs</text>

  <!-- Arrow down into nested onion -->
  <line x1="360" y1="100" x2="360" y2="136" stroke="#475569" stroke-width="2.5" marker-end="url(#arr-slate)"/>

  <!-- OUTER ONION: econcert -->
  <rect x="16" y="140" width="688" height="600" rx="18" fill="#fdf2f8" stroke="#db2777" stroke-width="2.2"/>
  <rect x="34" y="158" width="138" height="32" rx="16" fill="#be185d"/>
  <text x="103" y="179" text-anchor="middle" class="mono" font-size="14.5" font-weight="700" fill="#ffffff">3 · econcert</text>
  <rect x="184" y="160" width="256" height="28" rx="14" fill="#0f172a"/>
  <text x="312" y="178.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#f9a8d4">-tags "wordpress,enterprise"</text>
  <rect x="572" y="160" width="114" height="28" rx="14" fill="#ffffff" stroke="#db2777" stroke-width="1.6"/>
  <text x="629" y="178.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#be185d">40 SBOM</text>

  <!-- econcert additive chips (3 across) -->
  <rect x="34" y="204" width="208" height="66" rx="11" fill="#ffffff" stroke="#db2777" stroke-width="1.75"/>
  <text x="138" y="231" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#0f172a">Edge / Leaf Mesh</text>
  <text x="138" y="254" text-anchor="middle" class="sans" font-size="13" font-weight="500" fill="#334155">mTLS &amp; O(1) replay ring</text>

  <rect x="256" y="204" width="208" height="66" rx="11" fill="#ffffff" stroke="#db2777" stroke-width="1.75"/>
  <text x="360" y="231" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#0f172a">RBAC · MFA · SSO</text>
  <text x="360" y="254" text-anchor="middle" class="sans" font-size="13" font-weight="500" fill="#334155">Argon2id &amp; audit chain</text>

  <rect x="478" y="204" width="208" height="66" rx="11" fill="#ffffff" stroke="#db2777" stroke-width="1.75"/>
  <text x="582" y="231" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#0f172a">Redis &amp; Fast-Lane</text>
  <text x="582" y="254" text-anchor="middle" class="sans" font-size="13" font-weight="500" fill="#334155">HA sync · mail · x402</text>

  <!-- MIDDLE ONION: wpconcert -->
  <rect x="36" y="288" width="648" height="432" rx="16" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.2"/>
  <rect x="54" y="306" width="148" height="32" rx="16" fill="#0284c7"/>
  <text x="128" y="327" text-anchor="middle" class="mono" font-size="14.5" font-weight="700" fill="#ffffff">2 · wpconcert</text>
  <rect x="214" y="308" width="164" height="28" rx="14" fill="#0f172a"/>
  <text x="296" y="326.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#7dd3fc">-tags wordpress</text>
  <rect x="552" y="308" width="114" height="28" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
  <text x="609" y="326.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#0369a1">23 SBOM</text>

  <!-- wpconcert additive chips (3 across) -->
  <rect x="54" y="352" width="194" height="66" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="1.75"/>
  <text x="151" y="379" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#0f172a">FastCGI 1.0</text>
  <text x="151" y="402" text-anchor="middle" class="mono" font-size="12.5" font-weight="600" fill="#0369a1">fcgi+unix://</text>

  <rect x="263" y="352" width="194" height="66" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="1.75"/>
  <text x="360" y="379" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#0f172a">GET Micro-Cache</text>
  <text x="360" y="402" text-anchor="middle" class="sans" font-size="13" font-weight="500" fill="#334155">Singleflight · cart-safe</text>

  <rect x="472" y="352" width="194" height="66" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="1.75"/>
  <text x="569" y="379" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#0f172a">WP CLI &amp; Preset</text>
  <text x="569" y="402" text-anchor="middle" class="mono" font-size="12.5" font-weight="600" fill="#0369a1">doctor &amp; init</text>

  <!-- INNER CORE ONION: concert -->
  <rect x="56" y="436" width="608" height="264" rx="15" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2"/>
  <rect x="74" y="454" width="132" height="32" rx="16" fill="#7c3aed"/>
  <text x="140" y="475" text-anchor="middle" class="mono" font-size="14.5" font-weight="700" fill="#ffffff">1 · concert</text>
  <rect x="218" y="456" width="140" height="28" rx="14" fill="#0f172a"/>
  <text x="288" y="474.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#ddd6fe">default tags</text>
  <rect x="532" y="456" width="114" height="28" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="589" y="474.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#6d28d9">23 SBOM</text>

  <!-- Core 2x2 capability grid -->
  <rect x="74" y="502" width="278" height="82" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-width="1.75"/>
  <text x="213" y="534" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#0f172a">FIFO Waiting Room</text>
  <text x="213" y="560" text-anchor="middle" class="sans" font-size="13.5" font-weight="500" fill="#334155">Priority lane &amp; Ed25519 passes</text>

  <rect x="368" y="502" width="278" height="82" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-width="1.75"/>
  <text x="507" y="534" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#0f172a">TLS · HTTP/2 · HTTP/3</text>
  <text x="507" y="560" text-anchor="middle" class="sans" font-size="13.5" font-weight="500" fill="#334155">ACME :80→:443 &amp; opt-in QUIC</text>

  <rect x="74" y="598" width="278" height="82" rx="11" fill="#ffffff" stroke="#0d9488" stroke-width="1.75"/>
  <text x="213" y="630" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#0f172a">os.Root Static Offload</text>
  <text x="213" y="656" text-anchor="middle" class="sans" font-size="13.5" font-weight="500" fill="#334155">.br/.gz · ETag · pass-gated disk</text>

  <rect x="368" y="598" width="278" height="82" rx="11" fill="#ffffff" stroke="#0d9488" stroke-width="1.75"/>
  <text x="507" y="630" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#0f172a">Concertfile &amp; Portal</text>
  <text x="507" y="656" text-anchor="middle" class="sans" font-size="13.5" font-weight="500" fill="#334155">Multi-vhost · SIGHUP · metrics</text>
</svg>
