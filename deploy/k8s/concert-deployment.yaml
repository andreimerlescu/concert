# Core Edition (concert, Apache-2.0) Kubernetes Deployment.
# Uses only Core Edition environment variables (zero enterprise-only flags).
# For RBAC/MFA, Redis HA, edge/leaf mesh, and x402 Fast-Lane, see deployment.yaml (econcert).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concert
  labels:
    app.kubernetes.io/name: concert
    app.kubernetes.io/component: waiting-room-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: concert
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: concert
    spec:
      serviceAccountName: concert
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: concert
          image: ghcr.io/andreimerlescu/concert:v0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: portal
              containerPort: 8081
              protocol: TCP
          env:
            - name: CONCERT_LISTEN
              value: ":8080"
            - name: CONCERT_UPSTREAM
              value: "http://origin-0.origin.svc.cluster.local:3000,http://origin-1.origin.svc.cluster.local:3000"
            - name: CONCERT_CAPACITY
              value: "200"
            - name: CONCERT_MAX_QUEUE
              value: "2000"
            - name: CONCERT_STATS_AUTH
              value: "true"
            - name: CONCERT_READ_ONLY_SETTINGS
              value: "true"
            - name: CONCERT_SECURE_COOKIE
              value: "true"
            - name: CONCERT_HSTS_MAX_AGE
              value: "31536000"
            - name: CONCERT_LOG_FORMAT
              value: "json"
            - name: CONCERT_PRIVACY_SCRUB_QUERY
              value: "true"
            - name: CONCERT_UPSTREAM_HEALTH_PATH
              value: "/healthz"
            - name: CONCERT_UPSTREAM_CB_FAILURES
              value: "5"
            - name: CONCERT_DATA_DIR
              value: "/var/lib/concert/data"
            - name: CONCERT_ADMIT_SECRET_FILE
              value: "/run/secrets/concert/admit_secret"
            - name: CONCERT_ADMIN_TOKEN_FILE
              value: "/run/secrets/concert/admin_token"
            - name: CONCERT_PORTAL_LISTEN
              value: "127.0.0.1:8081"
            - name: CONCERT_PORTAL_PASS_FILE
              value: "/run/secrets/concert/portal_pass"
            - name: CONCERT_PORTAL_SECURE_COOKIE
              value: "true"
          livenessProbe:
            httpGet:
              path: /_room/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_room/readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/concert/data
            - name: secrets
              mountPath: /run/secrets/concert
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: secrets
          secret:
            secretName: concert-core-secrets
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: concert
  labels:
    app.kubernetes.io/name: concert
spec:
  selector:
    app.kubernetes.io/name: concert
  sessionAffinity: ClientIP
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: concert
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: concert
